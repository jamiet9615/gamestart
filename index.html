<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>七遊戲情報站</title>
<style>
:root{--bg:#FFF8E9;--pink:#FFE9ED;--blue:#D1EBFF;--text:#3D3A38;--muted:#7a746f;--line:rgba(61,58,56,.12);--card:rgba(255,255,255,.55);--shadow:rgba(61,58,56,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#2b2826;--pink:#4a3a3f;--blue:#34454f;--text:#f2ebe0;--muted:#b3aaa0;--line:rgba(255,255,255,.14);--card:rgba(255,255,255,.06);--shadow:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#2b2826;--pink:#4a3a3f;--blue:#34454f;--text:#f2ebe0;--muted:#b3aaa0;--line:rgba(255,255,255,.14);--card:rgba(255,255,255,.06);--shadow:rgba(0,0,0,.4)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:.04em}
h2{font-size:17px;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 16px;font-size:13px}
.note{background:var(--pink);border-radius:12px;padding:8px 12px;font-size:12.5px;margin-bottom:16px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.cal-h{text-align:center;font-weight:700;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--muted)}
.day{min-height:52px;border-radius:10px;padding:3px;background:transparent;border:1px solid transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.day:hover{background:var(--blue);filter:brightness(.94)}
.day.today{border-color:var(--text)}
.day.sel{background:var(--blue);box-shadow:0 0 0 2px var(--text) inset}
.day.out{opacity:.3}
.day b{font-size:12px;font-weight:500}
.bar{height:6px;border-radius:3px}
.nav{display:flex;justify-content:center;gap:12px;margin-top:10px}
.nav button{width:44px;height:36px;border:1px solid var(--line);background:var(--blue);color:var(--text);border-radius:12px;font-size:18px;cursor:pointer;transition:box-shadow .15s,filter .15s}
.nav button:hover,.btn:hover,.gh:hover{filter:brightness(.93);box-shadow:0 4px 10px var(--shadow)}
.detail{margin-top:10px;min-height:24px;font-size:13.5px}
.detail span{display:inline-flex;align-items:center;gap:6px;margin:2px 10px 2px 0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.game{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.gh{width:100%;display:flex;align-items:center;gap:10px;padding:14px;background:transparent;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:box-shadow .15s,filter .15s}
.gh .dot{width:14px;height:14px}
.gh .n{font-weight:700;flex:1}
.gh .v{font-size:13px;color:var(--muted)}
.arr{transition:transform .2s}
.game.open .arr{transform:rotate(180deg)}
.body{display:none;padding:0 14px 14px}
.game.open .body{display:block}
.info{background:var(--pink);border-radius:12px;padding:10px 12px;font-size:14px}
.info p{margin:3px 0}
.tag{display:inline-block;font-size:12px;padding:0 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line);margin:0 4px 2px 0}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.btn{display:block;padding:10px 12px;border-radius:12px;background:var(--blue);color:var(--text);text-decoration:none;font-size:14px;border:1px solid var(--line);transition:box-shadow .15s,filter .15s}
.btn.leak{background:var(--pink)}
.btn small{display:block;color:var(--muted);font-size:12px}
a:focus-visible,button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.back{display:inline-block;margin-bottom:12px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:16px}
</style>
</head>
<body>
<main id="app"></main>
<script>
var G=[
{id:"genshin",n:"原神",c:"#F2B35E",cur:"示範 6.2",s:"2026-11-05",next:"2026-12-17",live:"2026-12-04",mid:"2026-11-26",ban:[["新角色 A","new"],["復刻角色 B","re"]],sub:"r/Genshin_Impact_Leaks",kw:"Version, Banner, Livestream",L:[["官方網站","https://genshin.hoyoverse.com/zh-tw"],["官方社群：HoYoLAB","https://www.hoyolab.com/"],["解包數值：nanoka.cc","https://nanoka.cc/"]]},
{id:"hsr",n:"崩壞：星穹鐵道",c:"#9C8CE0",cur:"示範 4.x",s:"2026-11-12",next:"2026-12-24",live:"2026-12-11",mid:"2026-12-03",ban:[["新角色 C","new"]],sub:"r/HonkaiStarRail_leaks",kw:"Version, Banner, Schedule",L:[["官方網站","https://hsr.hoyoverse.com/zh-tw/home"],["官方社群：HoYoLAB","https://www.hoyolab.com/"],["解包數值：nanoka.cc","https://nanoka.cc/"]]},
{id:"zzz",n:"絕區零",c:"#F08A6B",cur:"示範 2.x",s:"2026-11-19",next:"2026-12-31",live:"2026-12-18",mid:"2026-12-10",ban:[["新角色 D","new"],["復刻角色 E","re"]],sub:"r/Zenlesszonezeroleaks_",kw:"Version, Banner, Livestream",L:[["官方網站","https://zenless.hoyoverse.com/m/zh-tw/main"],["官方社群：HoYoLAB","https://www.hoyolab.com/"],["解包數值：nanoka.cc","https://nanoka.cc/"]]},
{id:"wuwa",n:"鳴潮",c:"#6EC3C0",cur:"示範 3.x",s:"2026-11-06",next:"2026-12-18",live:"2026-12-05",mid:"2026-11-27",ban:[["新角色 F","new"]],sub:"r/WutheringWavesLeaks",kw:"Version, Banner, Livestream",L:[["官方網站","https://wutheringwaves.kurogames.com/m/zh-tw/main"],["解包數值：nanoka.cc","https://nanoka.cc/"]]},
{id:"endfield",n:"明日方舟：終末地",c:"#E8C94F",cur:"示範 1.x",s:"2026-11-20",next:"2026-12-30",live:"2026-12-17",mid:"2026-12-09",ban:[["新角色 G","new"]],sub:"r/ArknightsEndfieldLeak",kw:"（不限）",L:[["官方網站","https://endfield.gryphline.com/zh-tw#home"],["巴哈姆特哈啦板","https://forum.gamer.com.tw/"]]},
{id:"nte",n:"異環",c:"#E58FB6",cur:"示範 1.x",s:"2026-11-26",next:"2027-01-07",live:"2026-12-24",mid:"2026-12-16",ban:[["新角色 H","new"]],sub:"r/NTELeaks",kw:"（不限）",L:[["官方網站","https://nte.iwplay.com.tw/index.html"],["巴哈姆特哈啦板","https://forum.gamer.com.tw/"]]},
{id:"tot",n:"時空中的繪旅人",c:"#7FB5E8",cur:"示範 台服",s:"2026-11-14",next:"2026-12-12",live:"（以台服粉專為準）",mid:"2026-11-28",ban:[["新卡池 I","new"]],sub:"台服粉專預告貼文",kw:"活動、卡池、維護",L:[["官方網站","https://www.foralltime.com.tw/m/"],["巴哈姆特哈啦板","https://forum.gamer.com.tw/"]]}
];
var E={};
function add(d,g,t){if(!/^\d{4}-/.test(d))return;(E[d]=E[d]||[]).push({c:g.c,t:"["+g.n+"] "+t})}
G.forEach(function(g){add(g.next,g,"新版本上線");add(g.live,g,"前瞻直播");add(g.mid,g,"下半卡池切換");add(g.s,g,"當前版本上線")});
var now=new Date(),Y=now.getFullYear(),M=now.getMonth(),sel=null;
function p(n){return n<10?"0"+n:""+n}
function key(y,m,d){return y+"-"+p(m+1)+"-"+p(d)}
function days(d){if(!/^\d{4}-/.test(d))return"—";return Math.ceil((new Date(d+"T00:00:00")-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5)}
function calHtml(){
var f=new Date(Y,M,1).getDay(),n=new Date(Y,M+1,0).getDate(),h='<div class="cal"><div class="cal-h">'+Y+" 年 "+(M+1)+' 月</div><div class="grid">';
"日一二三四五六".split("").forEach(function(w){h+='<div class="wd">'+w+"</div>"});
for(var i=0;i<f;i++)h+="<div></div>";
for(var d=1;d<=n;d++){var k=key(Y,M,d),ev=E[k]||[],t=k===key(now.getFullYear(),now.getMonth(),now.getDate());
h+='<button class="day'+(t?" today":"")+(sel===k?" sel":"")+'" data-k="'+k+'" title="'+ev.map(function(e){return e.t}).join("、")+'"><b>'+d+"</b>"+ev.map(function(e){return'<i class="bar" style="background:'+e.c+'"></i>'}).join("")+"</button>"}
h+='</div><div class="nav"><button data-m="-1" aria-label="上個月">&lt;</button><button data-m="1" aria-label="下個月">&gt;</button></div><div class="detail" id="detail">'+detail()+"</div></div>";return h}
function detail(){if(!sel)return'<span style="color:var(--muted)">點選日期查看事件</span>';var ev=E[sel]||[];return ev.length?ev.map(function(e){return'<span><i class="dot" style="background:'+e.c+'"></i>'+e.t+"</span>"}).join(""):'<span style="color:var(--muted)">'+sel+" 沒有事件</span>"}
function gameHtml(g){
var b=g.ban.map(function(x){return'<span class="tag">'+(x[1]==="new"?"新":"復刻")+" "+x[0]+"</span>"}).join("");
var l=g.L.map(function(x){return x[1]?'<a class="btn" href="'+x[1]+'" target="_blank" rel="noopener">'+x[0]+"</a>":'<span class="btn" style="opacity:.6">'+x[0]+"</span>"}).join("");
return'<section class="game" id="g-'+g.id+'"><button class="gh" aria-expanded="false"><i class="dot" style="background:'+g.c+'"></i><span class="n">'+g.n+'</span><span class="v">'+g.cur+" ・ 下版倒數 "+days(g.next)+' 天</span><span class="arr">▾</span></button><div class="body"><div class="info"><p>當前版本：'+g.s+" 起，下版預計 "+g.next+"</p><p>前瞻直播："+g.live+"</p><p>卡池 UP："+b+'</p></div><div class="links"><a class="btn leak" href="#leaks-'+g.id+'">內鬼資訊整合<small>AI Agent 整理的爆料</small></a>'+l+"</div></div></section>"}
function home(){return'<h1>七遊戲情報站</h1><p class="sub">版本日程、卡池、爆料與攻略連結，一頁看完</p><div class="note">目前日期與角色皆為示範資料，之後由 AI Agent 從官方與社群來源自動更新。</div>'+calHtml()+"<h2>遊戲小抽屜</h2>"+G.map(gameHtml).join("")}
function leaks(id){var g=G.filter(function(x){return x.id===id})[0];if(!g)return home();return'<a class="btn back" href="#">‹ 回到首頁</a><h1>'+g.n+" 內鬼情報</h1><p class=\"sub\">AI Agent 整理的早期爆料、測試服改動與可信度標籤</p><div class=\"empty\"><p><b>尚未接上 AI Agent</b></p><p>資料來源："+g.sub+"</p><p>篩選關鍵字："+g.kw+'</p><p>接上後，這裡會列出每則爆料的摘要、來源連結與可信度（高／中／低）。</p></div>'}
function render(){var h=location.hash.replace("#","");document.getElementById("app").innerHTML=h.indexOf("leaks-")===0?leaks(h.slice(6)):home()}
document.addEventListener("click",function(e){
var t=e.target.closest("[data-m]");if(t){M+=+t.dataset.m;if(M<0){M=11;Y--}if(M>11){M=0;Y++}sel=null;render();return}
t=e.target.closest(".day");if(t){sel=t.dataset.k;render();return}
t=e.target.closest(".gh");if(t){var o=t.parentNode.classList.toggle("open");t.setAttribute("aria-expanded",o)}});
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
